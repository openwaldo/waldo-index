name: lookaside

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lookaside-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: lookaside
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install verifier dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Test lookaside verifier
        run: python3 .scripts/verify_lookaside_test.py
      - name: Verify remote lookaside objects
        run: python3 .scripts/verify_lookaside.py .
