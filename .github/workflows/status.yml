# On every change to main, regenerate status.json from the committed
# metadata and publish it to the gh-pages branch, which Pages serves.
# Machinery never touches main: the generated file lives quarantined on
# its own branch, whose history doubles as a time-series of the corpus's
# growth — one snapshot per data push. The publish step enforces that
# gh-pages contains ONLY the published files, so the corpus metadata is
# never deployed no matter how the branch was created.
name: status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install status generator dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Test mixed JSON and YAML metadata support
        run: python3 .scripts/status_test.py
      - name: Generate status.json from the committed tree
        run: |
          data=$(git rev-parse --short HEAD)
          python3 .scripts/status.py /tmp/status.json
          echo "data_commit=$data" >> "$GITHUB_ENV"
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages 2>/dev/null; then
            git switch gh-pages
          else
            git switch --orphan gh-pages
          fi
          git rm -rfq . 2>/dev/null || true
          cp /tmp/status.json status.json
          touch .nojekyll
          git add status.json .nojekyll
          git commit -m "status: ${data_commit}"
          git push origin gh-pages
